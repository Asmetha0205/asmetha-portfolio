<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="im-bg" cx="45%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="55%" stop-color="#0d0f20"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <linearGradient id="im-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="im-chart" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="im-blur1"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="im-glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="450" fill="url(#im-bg)"/>

  <circle cx="250" cy="180" r="150" fill="#8b5cf6" opacity="0.2" filter="url(#im-blur1)"/>
  <circle cx="600" cy="310" r="130" fill="#22d3ee" opacity="0.15" filter="url(#im-blur1)"/>

  <!-- browser window mockup -->
  <g transform="translate(80,70)">
    <rect width="400" height="300" rx="14" fill="#0d1424" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5"/>
    <!-- browser chrome bar -->
    <rect width="400" height="36" rx="14" fill="#0a0f1e"/>
    <rect y="14" width="400" height="22" fill="#0a0f1e"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444" opacity="0.7"/>
    <circle cx="38" cy="18" r="5" fill="#f59e0b" opacity="0.7"/>
    <circle cx="56" cy="18" r="5" fill="#22c55e" opacity="0.7"/>
    <!-- URL bar -->
    <rect x="72" y="10" width="260" height="16" rx="8" fill="#0d1424" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="84" y="22" fill="#8a93ab" font-family="monospace" font-size="9">insightmintblog.wordpress.com</text>

    <!-- page content area -->
    <!-- header hero -->
    <rect x="12" y="48" width="376" height="80" rx="8" fill="#1b1240" opacity="0.8"/>
    <text x="140" y="82" fill="#c4b5fd" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600">InsightMint</text>
    <text x="150" y="100" fill="#8a93ab" font-family="monospace" font-size="9">Digital Marketing &amp; Insights</text>

    <!-- article cards -->
    <rect x="12" y="140" width="118" height="80" rx="8" fill="#8b5cf6" opacity="0.2" stroke="#8b5cf6" stroke-opacity="0.3"/>
    <rect x="140" y="140" width="118" height="80" rx="8" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-opacity="0.3"/>
    <rect x="268" y="140" width="120" height="80" rx="8" fill="#22d3ee" opacity="0.1" stroke="#22d3ee" stroke-opacity="0.3"/>

    <!-- mini chart inside first card -->
    <polyline points="22,205 40,195 58,200 76,185 94,190 112,178" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.8"/>
    <circle cx="112" cy="178" r="2.5" fill="#22d3ee"/>

    <!-- megaphone glyph on second card -->
    <path d="M150 178 L168 172 L168 208 L150 202 Z" fill="#3b82f6" opacity="0.5"/>
    <rect x="146" y="186" width="4" height="10" rx="1" fill="#3b82f6" opacity="0.5"/>

    <!-- text lines -->
    <rect x="12" y="232" width="250" height="8" rx="4" fill="#ffffff" opacity="0.1"/>
    <rect x="12" y="246" width="200" height="8" rx="4" fill="#ffffff" opacity="0.08"/>
    <rect x="12" y="260" width="225" height="8" rx="4" fill="#ffffff" opacity="0.08"/>

    <!-- CTA button -->
    <rect x="280" y="236" width="96" height="24" rx="12" fill="url(#im-accent)" opacity="0.7"/>
    <text x="296" y="252" fill="#fff" font-family="monospace" font-size="9" font-weight="600">Read Insights</text>
  </g>

  <!-- analytics badge -->
  <g transform="translate(540,100)" filter="url(#im-glow)">
    <circle r="45" fill="#8b5cf6" opacity="0.25" transform="translate(45,45)"/>
    <polyline points="20,62 32,50 44,55 56,38 68,44 80,30" fill="none" stroke="#a5f3ff" stroke-width="2.5"/>
    <circle cx="80" cy="30" r="3" fill="#a5f3ff"/>
    <text x="2" y="82" fill="#8a93ab" font-family="monospace" font-size="9">Analytics</text>
  </g>

  <!-- right panel -->
  <g transform="translate(540,180)">
    <rect width="200" height="130" rx="12" fill="#0d1424" opacity="0.85" stroke="#8b5cf6" stroke-opacity="0.35"/>
    <text x="14" y="24" fill="#8a93ab" font-family="monospace" font-size="10">BLOG · OVERVIEW</text>
    <rect x="14" y="30" width="172" height="1" fill="#ffffff" opacity="0.08"/>
    <text x="14" y="52" fill="#c4b5fd" font-family="monospace" font-size="11">WordPress Blog</text>
    <text x="14" y="72" fill="#8a93ab" font-family="monospace" font-size="10">Brand Strategy</text>
    <text x="14" y="92" fill="#8a93ab" font-family="monospace" font-size="10">Campaign Case Studies</text>
    <text x="14" y="112" fill="#8a93ab" font-family="monospace" font-size="10">Marketing Analytics</text>
  </g>

  <!-- floating marketing icons -->
  <g filter="url(#im-glow)" opacity="0.9">
    <!-- target icon -->
    <g transform="translate(500,330)">
      <circle r="14" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <circle r="7" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <circle r="2" fill="#22d3ee"/>
    </g>
    <!-- bar chart icon -->
    <g transform="translate(560,345)">
      <rect x="0" y="14" width="6" height="10" rx="1" fill="#8b5cf6"/>
      <rect x="9" y="8" width="6" height="16" rx="1" fill="#3b82f6"/>
      <rect x="18" y="2" width="6" height="22" rx="1" fill="#22d3ee"/>
    </g>
    <!-- megaphone accent -->
    <g transform="translate(620,320)" stroke="#a5f3ff" stroke-width="2" fill="none" opacity="0.8">
      <path d="M0 12 L14 6 L14 26 L0 20 Z" fill="#a5f3ff" fill-opacity="0.15"/>
      <path d="M14 6 L22 2 M14 26 L22 30"/>
      <path d="M24 0 L28 4 M26 8 L30 12" stroke-opacity="0.5"/>
    </g>
  </g>
</svg>
