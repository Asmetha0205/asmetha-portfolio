<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ax-bg" cx="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#0a2030"/>
      <stop offset="55%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <linearGradient id="ax-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="ax-blur1"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="ax-glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="450" fill="url(#ax-bg)"/>

  <circle cx="400" cy="200" r="200" fill="#22d3ee" opacity="0.1" filter="url(#ax-blur1)"/>
  <circle cx="680" cy="350" r="140" fill="#3b82f6" opacity="0.18" filter="url(#ax-blur1)"/>

  <!-- data ring / radar -->
  <g transform="translate(400,220)" filter="url(#ax-glow)">
    <circle r="140" fill="none" stroke="#22d3ee" stroke-opacity="0.15" stroke-width="1"/>
    <circle r="100" fill="none" stroke="#22d3ee" stroke-opacity="0.2" stroke-width="1"/>
    <circle r="60" fill="none" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle r="22" fill="url(#ax-gold)" opacity="0.6"/>
    <circle r="22" fill="none" stroke="#a5f3ff" stroke-opacity="0.8" stroke-width="1.5"/>
    <!-- radar crosshairs -->
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#22d3ee" stroke-opacity="0.12"/>
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#22d3ee" stroke-opacity="0.12"/>
    <line x1="-99" y1="-99" x2="99" y2="99" stroke="#22d3ee" stroke-opacity="0.08"/>
    <line x1="99" y1="-99" x2="-99" y2="99" stroke="#22d3ee" stroke-opacity="0.08"/>
  </g>

  <!-- radar sweep sector -->
  <g transform="translate(400,220)" opacity="0.3" filter="url(#ax-glow)">
    <path d="M0 0 L0 -140 A140 140 0 0 1 99 -99 Z" fill="url(#ax-gold)" opacity="0.2"/>
  </g>

  <!-- data points on radar -->
  <g fill="#a5f3ff" filter="url(#ax-glow)">
    <circle cx="460" cy="130" r="5"/>
    <circle cx="510" cy="195" r="4"/>
    <circle cx="380" cy="100" r="4"/>
    <circle cx="310" cy="175" r="4"/>
    <circle cx="330" cy="290" r="4"/>
    <circle cx="490" cy="300" r="4"/>
  </g>

  <!-- stats panel -->
  <g transform="translate(560,80)">
    <rect width="200" height="130" rx="12" fill="#0d1424" opacity="0.88" stroke="#22d3ee" stroke-opacity="0.3"/>
    <text x="14" y="24" fill="#8a93ab" font-family="monospace" font-size="10">AUREX · ANALYSIS</text>
    <rect x="14" y="30" width="172" height="1" fill="#ffffff" opacity="0.08"/>
    <text x="14" y="52" fill="#22d3ee" font-family="monospace" font-size="11">AI-Powered</text>
    <text x="14" y="72" fill="#a5f3ff" font-family="monospace" font-size="12" font-weight="600">Data Platform</text>
    <text x="14" y="96" fill="#8a93ab" font-family="monospace" font-size="10">TetraTHON 2026</text>
    <text x="14" y="114" fill="#8a93ab" font-family="monospace" font-size="10">First Round</text>
  </g>

  <!-- left label panel -->
  <g transform="translate(40,100)">
    <rect width="150" height="80" rx="12" fill="#0d1424" opacity="0.8" stroke="#8b5cf6" stroke-opacity="0.35"/>
    <text x="14" y="24" fill="#8a93ab" font-family="monospace" font-size="10">SIGNAL DETECT</text>
    <text x="14" y="46" fill="#c4b5fd" font-family="monospace" font-size="13" font-weight="600">Active</text>
    <text x="14" y="66" fill="#8a93ab" font-family="monospace" font-size="10">Confidence: 94%</text>
  </g>

  <!-- TetraTHON R1 badge -->
  <g transform="translate(60,350)">
    <rect width="140" height="30" rx="15" fill="#22d3ee" opacity="0.15" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="16" y="20" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="600">TetraTHON · R1 2026</text>
  </g>
</svg>
