<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cv-bg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#0c2a30"/>
      <stop offset="55%" stop-color="#0a1424"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <linearGradient id="cv-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="cv-blur1"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="cv-glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="450" fill="url(#cv-bg)"/>

  <circle cx="200" cy="120" r="150" fill="#22d3ee" opacity="0.22" filter="url(#cv-blur1)"/>
  <circle cx="620" cy="330" r="150" fill="#8b5cf6" opacity="0.24" filter="url(#cv-blur1)"/>

  <!-- holographic projection grid -->
  <g stroke="#22d3ee" stroke-opacity="0.12">
    <ellipse cx="400" cy="410" rx="320" ry="24" fill="none"/>
    <ellipse cx="400" cy="410" rx="220" ry="16" fill="none"/>
    <ellipse cx="400" cy="410" rx="120" ry="8" fill="none"/>
  </g>

  <!-- flask -->
  <g transform="translate(150,120)" filter="url(#cv-glow)">
    <path d="M30 0 L30 60 L-10 150 Q -10 175 20 175 L100 175 Q130 175 130 150 L90 60 L90 0 Z"
      fill="none" stroke="#8a93ab" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M-2 150 Q -2 170 20 170 L100 170 Q122 170 122 150 L100 95 L20 95 Z" fill="url(#cv-liquid)" opacity="0.85"/>
    <circle cx="45" cy="130" r="5" fill="#e7ecf7" opacity="0.7"/>
    <circle cx="70" cy="150" r="3.5" fill="#e7ecf7" opacity="0.6"/>
    <circle cx="60" cy="110" r="3" fill="#e7ecf7" opacity="0.5"/>
    <rect x="18" y="-6" width="24" height="10" rx="2" fill="#8a93ab" opacity="0.6"/>
  </g>

  <!-- molecule cluster -->
  <g transform="translate(430,90)">
    <g stroke="#22d3ee" stroke-opacity="0.6" stroke-width="1.5">
      <line x1="0" y1="0" x2="55" y2="-30"/>
      <line x1="0" y1="0" x2="60" y2="35"/>
      <line x1="0" y1="0" x2="-10" y2="60"/>
      <line x1="60" y1="35" x2="120" y2="20"/>
    </g>
    <circle cx="0" cy="0" r="12" fill="#8b5cf6"/>
    <circle cx="55" cy="-30" r="8" fill="#22d3ee"/>
    <circle cx="60" cy="35" r="9" fill="#3b82f6"/>
    <circle cx="-10" cy="60" r="7" fill="#22d3ee"/>
    <circle cx="120" cy="20" r="8" fill="#a5f3ff"/>
  </g>

  <!-- second smaller molecule -->
  <g transform="translate(560,260)" opacity="0.85">
    <g stroke="#8b5cf6" stroke-opacity="0.6" stroke-width="1.3">
      <line x1="0" y1="0" x2="40" y2="-22"/>
      <line x1="0" y1="0" x2="34" y2="26"/>
    </g>
    <circle cx="0" cy="0" r="9" fill="#3b82f6"/>
    <circle cx="40" cy="-22" r="6" fill="#22d3ee"/>
    <circle cx="34" cy="26" r="6" fill="#a5f3ff"/>
  </g>

  <!-- analytics dashboard panel -->
  <g transform="translate(420,250)">
    <rect width="220" height="140" rx="14" fill="#0d1424" opacity="0.75" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="16" y="24" fill="#8a93ab" font-family="monospace" font-size="10">REACTOR · PARAMS</text>
    <polyline points="16,110 46,90 76,100 106,70 136,85 166,55 196,65"
      fill="none" stroke="#22d3ee" stroke-width="2" filter="url(#cv-glow)"/>
    <g fill="#8b5cf6" opacity="0.7">
      <rect x="16" y="118" width="10" height="14"/>
      <rect x="32" y="112" width="10" height="20"/>
      <rect x="48" y="122" width="10" height="10"/>
      <rect x="64" y="108" width="10" height="24"/>
      <rect x="80" y="116" width="10" height="16"/>
    </g>
  </g>
</svg>
