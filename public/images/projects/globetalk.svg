<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="gt-bg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#14243f"/>
      <stop offset="55%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <linearGradient id="gt-globe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="gt-blur1"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="gt-glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="450" fill="url(#gt-bg)"/>

  <circle cx="230" cy="230" r="170" fill="#3b82f6" opacity="0.2" filter="url(#gt-blur1)"/>
  <circle cx="600" cy="150" r="140" fill="#8b5cf6" opacity="0.22" filter="url(#gt-blur1)"/>

  <!-- globe -->
  <g transform="translate(230,230)">
    <circle r="120" fill="url(#gt-globe)" stroke="#3b82f6" stroke-opacity="0.5"/>
    <ellipse rx="120" ry="40" fill="none" stroke="#22d3ee" stroke-opacity="0.35"/>
    <ellipse rx="120" ry="80" fill="none" stroke="#22d3ee" stroke-opacity="0.3"/>
    <ellipse rx="40" ry="120" fill="none" stroke="#22d3ee" stroke-opacity="0.3"/>
    <ellipse rx="80" ry="120" fill="none" stroke="#22d3ee" stroke-opacity="0.25"/>
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#22d3ee" stroke-opacity="0.3"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#22d3ee" stroke-opacity="0.2"/>
  </g>

  <!-- language glyphs orbiting the globe -->
  <g fill="#a5f3ff" font-family="'Space Grotesk', sans-serif" opacity="0.85" filter="url(#gt-glow)">
    <text x="90" y="120" font-size="22">A</text>
    <text x="330" y="150" font-size="22">文</text>
    <text x="300" y="330" font-size="22">あ</text>
    <text x="120" y="340" font-size="22">Я</text>
    <text x="220" y="90" font-size="20">Ω</text>
  </g>

  <!-- speech bubbles with translation arrows -->
  <g transform="translate(430,80)">
    <rect width="150" height="80" rx="18" fill="#0d1424" stroke="#3b82f6" stroke-opacity="0.5"/>
    <path d="M20 80 L20 100 L46 80 Z" fill="#0d1424" stroke="#3b82f6" stroke-opacity="0.5"/>
    <line x1="20" y1="26" x2="120" y2="26" stroke="#e7ecf7" stroke-opacity="0.6"/>
    <line x1="20" y1="44" x2="100" y2="44" stroke="#e7ecf7" stroke-opacity="0.4"/>
    <line x1="20" y1="62" x2="110" y2="62" stroke="#e7ecf7" stroke-opacity="0.4"/>
  </g>

  <g filter="url(#gt-glow)" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="2" fill="none">
    <path d="M500 175 C 520 210, 520 230, 500 255"/>
    <path d="M498 253 l6 8 M498 253 l-8 4" />
  </g>

  <g transform="translate(440,270)">
    <rect width="160" height="86" rx="18" fill="#0d1424" stroke="#8b5cf6" stroke-opacity="0.55"/>
    <path d="M30 0 L30 -20 L56 0 Z" fill="#0d1424" stroke="#8b5cf6" stroke-opacity="0.55"/>
    <line x1="20" y1="28" x2="130" y2="28" stroke="#e7ecf7" stroke-opacity="0.6"/>
    <line x1="20" y1="46" x2="110" y2="46" stroke="#e7ecf7" stroke-opacity="0.4"/>
    <line x1="20" y1="64" x2="120" y2="64" stroke="#e7ecf7" stroke-opacity="0.4"/>
  </g>

  <!-- floating AI translation node -->
  <g filter="url(#gt-glow)">
    <circle cx="640" cy="200" r="10" fill="#a5f3ff"/>
    <circle cx="640" cy="200" r="20" fill="none" stroke="#a5f3ff" stroke-opacity="0.5"/>
  </g>
</svg>
