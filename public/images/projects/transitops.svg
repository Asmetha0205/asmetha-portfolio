<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="to-bg" cx="40%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#0f2240"/>
      <stop offset="55%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <linearGradient id="to-route" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="to-blur1"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="to-glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="450" fill="url(#to-bg)"/>

  <circle cx="600" cy="100" r="150" fill="#3b82f6" opacity="0.22" filter="url(#to-blur1)"/>
  <circle cx="140" cy="370" r="120" fill="#22d3ee" opacity="0.18" filter="url(#to-blur1)"/>

  <!-- map grid -->
  <g stroke="#e7ecf7" stroke-opacity="0.05">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="220" y1="0" x2="220" y2="450"/>
    <line x1="340" y1="0" x2="340" y2="450"/>
    <line x1="460" y1="0" x2="460" y2="450"/>
    <line x1="580" y1="0" x2="580" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- route paths -->
  <g filter="url(#to-glow)">
    <path d="M80 350 C 160 300, 220 240, 320 200 S 460 160, 560 120 S 680 90, 740 70"
      fill="none" stroke="url(#to-route)" stroke-width="2.5" stroke-dasharray="8 5"/>
    <path d="M80 390 C 180 360, 280 310, 380 280 S 500 240, 620 200"
      fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 6" opacity="0.7"/>
  </g>

  <!-- bus stops -->
  <g fill="#22d3ee" filter="url(#to-glow)">
    <circle cx="80" cy="350" r="6"/>
    <circle cx="320" cy="200" r="7"/>
    <circle cx="560" cy="120" r="6"/>
    <circle cx="740" cy="70" r="8"/>
  </g>

  <!-- bus icon -->
  <g transform="translate(260,130)" filter="url(#to-glow)">
    <rect width="60" height="36" rx="6" fill="#0d1424" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="1.5"/>
    <rect x="6" y="6" width="20" height="14" rx="3" fill="#22d3ee" opacity="0.5"/>
    <rect x="34" y="6" width="20" height="14" rx="3" fill="#22d3ee" opacity="0.5"/>
    <rect x="6" y="26" width="8" height="8" rx="4" fill="#3b82f6"/>
    <rect x="22" y="26" width="8" height="8" rx="4" fill="#3b82f6"/>
    <rect x="38" y="26" width="8" height="8" rx="4" fill="#3b82f6"/>
    <rect x="52" y="26" width="8" height="8" rx="4" fill="#3b82f6"/>
  </g>

  <!-- dashboard panel -->
  <g transform="translate(440,220)">
    <rect width="260" height="160" rx="14" fill="#0d1424" opacity="0.85" stroke="#3b82f6" stroke-opacity="0.35"/>
    <text x="16" y="24" fill="#8a93ab" font-family="monospace" font-size="10">TRANSIT OPS · DASHBOARD</text>
    <rect x="16" y="34" width="228" height="1" fill="#ffffff" opacity="0.08"/>
    <text x="16" y="54" fill="#22d3ee" font-family="monospace" font-size="11">Vehicles Active</text>
    <text x="190" y="54" fill="#a5f3ff" font-family="monospace" font-size="13" font-weight="600">24</text>
    <text x="16" y="76" fill="#22d3ee" font-family="monospace" font-size="11">On-time Rate</text>
    <text x="190" y="76" fill="#a5f3ff" font-family="monospace" font-size="13" font-weight="600">91%</text>
    <text x="16" y="98" fill="#22d3ee" font-family="monospace" font-size="11">Routes</text>
    <text x="190" y="98" fill="#a5f3ff" font-family="monospace" font-size="13" font-weight="600">12</text>
    <polyline points="16,140 50,120 85,132 120,110 155,124 190,98 225,112"
      fill="none" stroke="#8b5cf6" stroke-width="2" filter="url(#to-glow)"/>
  </g>

  <!-- Odoo pill -->
  <g transform="translate(60,60)">
    <rect width="110" height="30" rx="15" fill="#8b5cf6" opacity="0.25" stroke="#8b5cf6" stroke-opacity="0.5"/>
    <text x="20" y="20" fill="#c4b5fd" font-family="monospace" font-size="11" font-weight="600">ODOO HACKATHON</text>
  </g>
</svg>
