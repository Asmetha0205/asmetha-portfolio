<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fd-bg" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#2a1a12"/>
      <stop offset="45%" stop-color="#12101f"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <linearGradient id="fd-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1240"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>
    <filter id="fd-blur1"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="fd-glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="450" fill="url(#fd-bg)"/>

  <circle cx="650" cy="120" r="150" fill="#fb923c" opacity="0.18" filter="url(#fd-blur1)"/>
  <circle cx="140" cy="360" r="140" fill="#8b5cf6" opacity="0.22" filter="url(#fd-blur1)"/>

  <!-- map with route -->
  <g transform="translate(400,60)" opacity="0.9">
    <rect width="330" height="210" rx="16" fill="#0d1424" stroke="#3b82f6" stroke-opacity="0.3"/>
    <g stroke="#e7ecf7" stroke-opacity="0.06">
      <line x1="0" y1="50" x2="330" y2="50"/>
      <line x1="0" y1="100" x2="330" y2="100"/>
      <line x1="0" y1="150" x2="330" y2="150"/>
      <line x1="80" y1="0" x2="80" y2="210"/>
      <line x1="170" y1="0" x2="170" y2="210"/>
      <line x1="250" y1="0" x2="250" y2="210"/>
    </g>
    <path d="M40 180 C 100 170, 120 120, 180 100 S 260 60, 300 40"
      fill="none" stroke="#fb923c" stroke-width="3" stroke-dasharray="8 8" filter="url(#fd-glow)"/>
    <circle cx="40" cy="180" r="7" fill="#22d3ee"/>
    <g filter="url(#fd-glow)">
      <circle cx="300" cy="40" r="9" fill="#fb923c"/>
      <path d="M300 20 L306 35 L294 35 Z" fill="#fb923c"/>
    </g>
  </g>

  <!-- smartphone -->
  <g transform="translate(70,60)" filter="url(#fd-glow)">
    <rect width="170" height="330" rx="26" fill="#0a0f1e" stroke="#8a93ab" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="8" y="16" width="154" height="298" rx="14" fill="url(#fd-screen)"/>
    <rect x="22" y="34" width="126" height="16" rx="4" fill="#e7ecf7" opacity="0.15"/>
    <rect x="22" y="64" width="126" height="90" rx="12" fill="#8b5cf6" opacity="0.25" stroke="#8b5cf6" stroke-opacity="0.5"/>
    <circle cx="60" cy="100" r="20" fill="#fb923c" opacity="0.9"/>
    <rect x="90" y="90" width="46" height="8" rx="3" fill="#e7ecf7" opacity="0.5"/>
    <rect x="90" y="104" width="34" height="8" rx="3" fill="#e7ecf7" opacity="0.3"/>
    <rect x="22" y="170" width="126" height="60" rx="12" fill="#22d3ee" opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="34" y="196" fill="#22d3ee" font-family="monospace" font-size="11">ARRIVING</text>
    <text x="34" y="214" fill="#e7ecf7" font-family="monospace" font-size="11" opacity="0.7">12 MIN</text>
    <rect x="22" y="246" width="126" height="34" rx="17" fill="#fb923c" opacity="0.9"/>
  </g>

  <!-- pizza -->
  <g transform="translate(300,300)">
    <path d="M0 0 L70 0 A70 70 0 0 1 0 70 Z" fill="#fb923c" opacity="0.9"/>
    <path d="M0 0 L70 0 A70 70 0 0 1 0 70 Z" fill="none" stroke="#ffd39a" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="20" cy="18" r="5" fill="#7c2d12"/>
    <circle cx="42" cy="30" r="5" fill="#7c2d12"/>
    <circle cx="24" cy="42" r="5" fill="#7c2d12"/>
  </g>

  <!-- burger -->
  <g transform="translate(240,330)">
    <ellipse cx="0" cy="30" rx="46" ry="14" fill="#fb923c"/>
    <rect x="-46" y="10" width="92" height="14" fill="#65a30d" opacity="0.8"/>
    <rect x="-46" y="0" width="92" height="12" fill="#78350f" opacity="0.9"/>
    <ellipse cx="0" cy="-6" rx="46" ry="16" fill="#f59e0b"/>
    <circle cx="-18" cy="-10" r="2.5" fill="#fff7ed" opacity="0.8"/>
    <circle cx="4" cy="-13" r="2.5" fill="#fff7ed" opacity="0.8"/>
    <circle cx="20" cy="-9" r="2.5" fill="#fff7ed" opacity="0.8"/>
  </g>
</svg>
